server:
  port: ${SERVER_PORT:8088}
  tomcat:
    max-http-form-post-size: 16MB
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}

spring:
  application:
    name: yolk-cloud
  profiles:
    default: local
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 3

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yolk
  configuration:
    map-underscore-to-camel-case: true

yolk:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-at-least-32-chars}
    expiration-ms: 604800000

logging:
  level:
    com.yolk: INFO
    org.mybatis: INFO
