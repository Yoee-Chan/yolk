spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:www.danhuang.org.cn}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yolk}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:yoee20260531!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:300000}

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: ${SERVER_SSL_KEY_STORE:file:app/ssl/www.danhuang.org.cn.p12}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:change-me}
    key-alias: ${SERVER_SSL_KEY_ALIAS:www.danhuang.org.cn}

# Docker / SIT environment configuration
yolk:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://www.danhuang.org.cn
      - https://www.danhuang.org.cn

logging:
  level:
    com.yolk: INFO
    org.mybatis: INFO
